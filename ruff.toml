# Repo-wide lint/format gate for all Python bundled with skills.
# Skills get vendored into repos whose lint gates run repo-wide, so the
# bundled Python must stay clean under common strictness (issue #62).
# Settings match or exceed the strictest known downstream consumer
# (briandconnelly/codex-in-claude: line-length 100, E/F/W/I/B/UP/SIM/PIE/
# RUF/PL/PT/TID/TC/ARG/PTH).
line-length = 100
target-version = "py311"

# Markdown is out of scope for both lint and format.
#
# Ruff 0.16 formats Python code blocks inside Markdown; the version prek pins
# (0.15.21) does not. Without this, a contributor running a bare `ruff format .`
# with a newer ruff silently rewrites Python blocks in archived run records
# under hypothesis-driven-analysis/tests/runs/ and in scenario fixtures like
# tests/fixtures/s18-analytics/SKILL.md. Both are measured stimulus and
# historical evidence: an archived run is what an agent actually wrote, and a
# fixture's wording is the thing an arm was scored against. Reformatting either
# invalidates the measurement it carries, and does it invisibly — the diff looks
# like harmless whitespace. Observed 2026-08-08 on both files.
extend-exclude = ["*.md"]

[lint]
select = [
  "E",   # pycodestyle errors (incl. E501 line length)
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "PIE", # flake8-pie
  "RUF", # ruff-specific
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "TID", # flake8-tidy-imports
  "TC",  # flake8-type-checking
  "ARG", # flake8-unused-arguments
  "PTH", # flake8-use-pathlib
]
