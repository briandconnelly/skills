name: pi-drift

# Scheduled drift check for the pi-coding-agent skill; see
# pi-coding-agent/MAINTAINING.md, "Scheduled drift check".

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/pi-drift.yml
      - pi-coding-agent/scripts/drift_report.py

permissions:
  contents: read
  issues: write

concurrency:
  group: pi-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - name: Install the latest Pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@latest
      - name: Run check_drift.py
        id: drift
        run: |
          set +e
          uv run pi-coding-agent/scripts/check_drift.py > drift.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          echo "installed=$(pi --version)" >> "$GITHUB_OUTPUT"
          cat drift.txt
      - name: Report to a pi-drift issue (dry run on pull requests)
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT_EXIT: ${{ steps.drift.outputs.exit }}
          PI_INSTALLED: ${{ steps.drift.outputs.installed }}
          EVENT: ${{ github.event_name }}
        run: |
          args=(--output drift.txt --exit-code "$DRIFT_EXIT" --installed "$PI_INSTALLED")
          if [ "$EVENT" = pull_request ]; then args+=(--dry-run); fi
          uv run pi-coding-agent/scripts/drift_report.py "${args[@]}"
