minimum_prek_version = "0.3.0"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
  { id = "check-yaml" },
  { id = "check-toml" },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.21"
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-hooks-apply" },
  { id = "check-useless-excludes" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "check-skill-frontmatter", name = "Validate SKILL.md frontmatter against agentskills.io spec", language = "python", language_version = "python3", additional_dependencies = ["pyyaml>=6"], entry = "python scripts/check-skill-frontmatter.py", files = "(?:^|/)SKILL\\.md$", pass_filenames = true },
  { id = "check-skill-frontmatter-tests", name = "check-skill-frontmatter: delimiter and field tests", language = "system", entry = "uv run --with pytest --with pyyaml pytest scripts/tests -q", files = "^scripts/(check-skill-frontmatter\\.py|tests/test_check_skill_frontmatter\\.py)$", pass_filenames = false },
  { id = "agent-bot-identity-selflocate", name = "agent-bot-identity: shared scripts self-locate and fail closed", language = "system", entry = "bash agent-bot-identity/tests/selflocate-test.sh", files = "^agent-bot-identity/scripts/", pass_filenames = false },
  { id = "agent-bot-identity-selector-cache", name = "agent-bot-identity: installation selection and per-installation token cache", language = "system", entry = "bash agent-bot-identity/tests/selector-cache-test.sh", files = "^agent-bot-identity/(scripts/|tests/selector-cache-test\\.sh)", pass_filenames = false },
  { id = "agent-bot-identity-routing", name = "agent-bot-identity: routing verdict and effective git transport", language = "system", entry = "bash agent-bot-identity/tests/routing-test.sh", files = "^agent-bot-identity/(scripts/|tests/routing-test\\.sh)", pass_filenames = false },
  { id = "agent-bot-identity-static-block", name = "agent-bot-identity: static adapter env blocks resolve as documented", language = "system", entry = "bash agent-bot-identity/tests/static-block-test.sh", files = "^agent-bot-identity/(references/adapters/(claude-code|codex)\\.md|tests/static-block-test\\.sh)$", pass_filenames = false },
  { id = "agent-bot-identity-bot-token", name = "agent-bot-identity: bot-token mint path against a local fake API", language = "system", entry = "bash agent-bot-identity/tests/bot-token-test.sh", files = "^agent-bot-identity/(scripts/bot-token|tests/(bot-token-test\\.sh|fake_github_api\\.py))$", pass_filenames = false },
  { id = "validate-mcp-fixtures", name = "agent-friendly-mcp: wire fixtures conform to the outputSchema/error contract", language = "python", language_version = "python3", additional_dependencies = ["jsonschema>=4"], entry = "python agent-friendly-mcp/tests/validate_fixture.py", files = "^agent-friendly-mcp/tests/fixtures/.*\\.json$", pass_filenames = true },
  { id = "check-mcp-rule-ids", name = "agent-friendly-mcp: rule ids are unique, cited ids resolve, manifest matches", language = "python", language_version = "python3", entry = "python agent-friendly-mcp/tests/check_rule_ids.py", files = "^agent-friendly-mcp/(SKILL\\.md|references/.*\\.md|tests/(scenarios\\.md|check_rule_ids\\.py|rule-ids\\.txt))$", pass_filenames = false },
  { id = "check-mcp-stale-terms", name = "agent-friendly-mcp: no retired 2025-11-25 protocol taught as current", language = "python", language_version = "python3", entry = "python agent-friendly-mcp/tests/check_stale_terms.py", files = "^agent-friendly-mcp/(SKILL\\.md|references/.*\\.md|tests/(scenarios\\.md|check_stale_terms\\.py))$", pass_filenames = false },
  { id = "check-mcp-fact-sync", name = "agent-friendly-mcp: shared facts intact at restatement sites (self-testing probes)", language = "python", language_version = "python3", entry = "python agent-friendly-mcp/tests/check_fact_sync.py", files = "^agent-friendly-mcp/(SKILL\\.md|references/examples\\.md|tests/(check_fact_sync|test_check_fact_sync)\\.py)$", pass_filenames = false },
  { id = "agent-friendly-mcp-tests", name = "agent-friendly-mcp: checker, fixture-validator, and example tests", language = "system", entry = "uv run --with pytest --with jsonschema --with pyyaml pytest agent-friendly-mcp/tests -q", files = "^agent-friendly-mcp/(SKILL\\.md|references/.*\\.md|tests/.*\\.(py|json|txt))$", pass_filenames = false },
  { id = "check-github-authority", name = "agent-friendly-github: one home per rule, no refuted claims, refs resolve", language = "python", language_version = "python3", entry = "python agent-friendly-github/tests/check_authority.py", files = "^agent-friendly-github/(SKILL\\.md|references/.*\\.md|decisions/.*\\.md|tests/(scenarios\\.md|check_authority\\.py))$", pass_filenames = false },
  { id = "pi-coding-agent-tests", name = "pi-coding-agent: pi-docs, pi-gate, and check-drift tests", language = "system", entry = "uv run --with pytest --with jsonschema pytest pi-coding-agent/tests -q", files = "^pi-coding-agent/", pass_filenames = false },
]
